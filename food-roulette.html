<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>今天吃什么</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #eee;
    --accent: #e94560;
    --gold: #f5c518;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* 背景粒子 */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0.15;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 0.2; }
    90%  { opacity: 0.1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  h1 {
    font-size: 2.5rem;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(245, 197, 24, 0.4);
    letter-spacing: 4px;
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 30px rgba(245, 197, 24, 0.4); }
    50%      { text-shadow: 0 0 50px rgba(245, 197, 24, 0.7), 0 0 80px rgba(233, 69, 96, 0.3); }
  }

  /* 转盘区域 */
  .wheel-wrapper {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 外圈装饰 */
  .wheel-outer {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 440px; height: 440px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a,
                                    #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a,
                                    #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a,
                                    #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a,
                                    #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a,
                                    #2a2a4a, #3a3a5a, #2a2a4a, #3a3a5a);
    box-shadow: 0 0 40px rgba(233, 69, 96, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 灯泡装饰点 */
  .bulb {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f5c518;
    box-shadow: 0 0 8px #f5c518;
  }

  canvas {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    cursor: pointer;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
  }

  /* 指针 */
  .pointer {
    position: absolute;
    right: 0px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 48px solid #e94560;
    filter: drop-shadow(0 2px 6px rgba(233,69,96,0.6));
    transition: transform 0.1s;
  }
  .pointer.spinning { animation: pointerShake 0.15s ease-in-out infinite; }
  @keyframes pointerShake {
    0%, 100% { transform: translateY(-50%) rotate(0deg); }
    25%      { transform: translateY(-50%) rotate(3deg); }
    75%      { transform: translateY(-50%) rotate(-3deg); }
  }

  /* 中心按钮 */
  .center-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: 80px; height: 80px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #e94560, #c0392b);
    color: #fff;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.5);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center-btn:hover {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow: 0 6px 30px rgba(233, 69, 96, 0.7);
  }
  .center-btn:active {
    transform: translate(-50%, -50%) scale(0.95);
  }
  .center-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    animation: btnPulse 0.8s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(233, 69, 96, 0.5); }
    50%      { box-shadow: 0 4px 35px rgba(233, 69, 96, 0.9); }
  }

  /* 结果弹窗 */
  .result-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .result-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .result-card {
    background: linear-gradient(135deg, #16213e, #1a1a2e);
    border: 2px solid #e94560;
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(233,69,96,0.2);
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .result-overlay.show .result-card {
    transform: scale(1);
  }
  .result-emoji { font-size: 4rem; margin-bottom: 10px; }
  .result-label { color: #999; font-size: 0.9rem; letter-spacing: 2px; }
  .result-food {
    font-size: 2.5rem;
    color: var(--gold);
    font-weight: bold;
    margin: 10px 0 20px;
    text-shadow: 0 0 20px rgba(245,197,24,0.3);
  }
  .result-btns { display: flex; gap: 12px; justify-content: center; }
  .btn {
    padding: 10px 24px;
    border-radius: 25px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #e94560, #c0392b);
    color: #fff;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }
  .btn-primary:hover { box-shadow: 0 6px 25px rgba(233,69,96,0.6); transform: translateY(-2px); }
  .btn-ghost {
    background: transparent;
    color: #aaa;
    border: 1px solid #444;
  }
  .btn-ghost:hover { color: #fff; border-color: #888; }

  /* 底部控制栏 */
  .controls {
    display: flex;
    gap: 15px;
    align-items: center;
  }
  .btn-sm {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid #444;
    background: transparent;
    color: #aaa;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn-sm:hover { color: #fff; border-color: var(--accent); background: rgba(233,69,96,0.1); }

  /* 自定义食物输入 */
  .custom-panel {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
  }
  .custom-panel input {
    flex: 1;
    min-width: 150px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #444;
    background: var(--card);
    color: #fff;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
  }
  .custom-panel input:focus { border-color: var(--accent); }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 15px;
    background: rgba(233,69,96,0.15);
    color: #e94560;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tag:hover { background: rgba(233,69,96,0.3); }
  .tag .remove { font-weight: bold; opacity: 0.5; }
  .tag:hover .remove { opacity: 1; }

  /* 食物标签列表 */
  .food-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 420px;
  }
  .food-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px 5px 12px;
    border-radius: 15px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    font-size: 0.82rem;
    cursor: default;
    transition: all 0.2s;
    user-select: none;
  }
  .food-tag:hover {
    background: rgba(233,69,96,0.12);
    border-color: rgba(233,69,96,0.3);
    color: #fff;
  }
  .food-tag .del {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: #888;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-left: 2px;
  }
  .food-tag .del:hover {
    background: #e94560;
    color: #fff;
  }

  /* 响应式 */
  @media (max-width: 500px) {
    body { overflow-y: auto; }
    .container { gap: 20px; padding: 20px 0; }
    h1 { font-size: 1.6rem; letter-spacing: 2px; }
    .wheel-wrapper, canvas { width: 300px !important; height: 300px !important; }
    .wheel-outer { width: 320px !important; height: 320px !important; }
    .center-btn { width: 56px; height: 56px; font-size: 0.85rem; }
    .pointer { right: 0px; border-top-width: 8px; border-bottom-width: 8px; border-right-width: 32px; }
    .food-tags { max-width: 320px; gap: 6px; }
    .food-tag { font-size: 0.78rem; padding: 6px 10px 6px 12px; }
    .food-tag .del { width: 20px; height: 20px; font-size: 0.75rem; }
    .result-food { font-size: 1.8rem; }
    .result-card { padding: 30px 24px; margin: 0 20px; }
    .custom-panel { max-width: 320px; }
    .custom-panel input { min-width: 120px; }
    .btn-sm { padding: 8px 16px; font-size: 0.8rem; }
  }

  @media (max-width: 360px) {
    .wheel-wrapper, canvas { width: 270px !important; height: 270px !important; }
    .wheel-outer { width: 290px !important; height: 290px !important; }
    .center-btn { width: 50px; height: 50px; font-size: 0.8rem; }
    .pointer { right: 0px; border-top-width: 7px; border-bottom-width: 7px; border-right-width: 28px; }
    .food-tags { max-width: 280px; }
    .custom-panel { max-width: 280px; }
  }
</style>
</head>
<body>

<!-- 背景粒子 -->
<div class="particles" id="particles"></div>

<div class="container">
  <h1>🍜 今天吃什么</h1>

  <!-- 转盘 -->
  <div class="wheel-wrapper" id="wheelWrapper">
    <div class="wheel-outer"></div>
    <canvas id="wheel" width="400" height="400"></canvas>
    <div class="pointer" id="pointer"></div>
    <button class="center-btn" id="spinBtn" onclick="spin()">开<br>转</button>
  </div>

  <!-- 操作栏 -->
  <div class="controls">
    <button class="btn-sm" onclick="resetFoods()">🔄 恢复默认</button>
    <button class="btn-sm" onclick="shuffleFoods()">🔀 打乱顺序</button>
  </div>

  <!-- 食物标签（点击 ✕ 移除） -->
  <div class="food-tags" id="foodTags"></div>

  <!-- 自定义添加 -->
  <div class="custom-panel">
    <input type="text" id="foodInput" placeholder="输入你想吃的（如：寿司）" maxlength="10"
           onkeydown="if(event.key==='Enter')addFood()">
    <button class="btn-sm" onclick="addFood()" style="color:#e94560;border-color:#e94560;">➕ 添加</button>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-emoji">🎉</div>
    <div class="result-label">命运选择了</div>
    <div class="result-food" id="resultText"></div>
    <div class="result-btns">
      <button class="btn btn-primary" onclick="spin()">🔄 再转一次</button>
      <button class="btn btn-ghost" onclick="closeResult()">知道了</button>
    </div>
  </div>
</div>

<script>
  // ========== 食物列表 ==========
  const DEFAULT_FOODS = [
    '🍲 麻辣烫', '🍗 黄焖鸡', '🍜 兰州拉面', '🥟 饺子',
    '🔥 麻辣香锅', '🍔 炸鸡汉堡', '🍝 螺蛳粉', '🍚 煲仔饭',
    '🍛 盖浇饭', '🥩 烤肉饭', '🍜 米线', '🥘 小火锅',
    '🍱 日料定食', '🥪 三明治', '🍕 披萨', '🌮 塔可'
  ];

  let foods = [...DEFAULT_FOODS];

  // ========== Canvas 设置 ==========
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const size = 400;
  const center = size / 2;
  const radius = size / 2 - 6;

  let currentAngle = 0;      // 当前角度（弧度）
  let spinning = false;
  let spinVelocity = 0;

  // 多彩色板
  const COLORS = [
    '#FF6B6B', '#FFA94D', '#FFD43B', '#69DB7C',
    '#4DABF7', '#748FFC', '#DA77F2', '#F783AC',
    '#FF8787', '#FFC078', '#FFE066', '#8CE99A',
    '#74C0FC', '#91A7FF', '#E599F7', '#FAA2C1'
  ];

  // ========== 绘制转盘 ==========
  function drawWheel(angle) {
    ctx.clearRect(0, 0, size, size);
    const n = foods.length;
    const sliceAngle = (2 * Math.PI) / n;

    for (let i = 0; i < n; i++) {
      const start = angle + i * sliceAngle;
      const end = start + sliceAngle;

      // 扇形
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();

      // 分割线
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.lineTo(center, center);
      ctx.strokeStyle = 'rgba(26,26,46,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 文字
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#1a1a2e';
      ctx.font = 'bold 15px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText(foods[i], radius - 28, 6);
      ctx.restore();
    }

    // 中心圆
    const grad = ctx.createRadialGradient(center, center, 35, center, center, 55);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, 'rgba(26,26,46,0.8)');
    ctx.beginPath();
    ctx.arc(center, center, 52, 0, 2 * Math.PI);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ========== 旋转逻辑 ==========
  function spin() {
    if (spinning) return;
    spinning = true;

    const spinBtn = document.getElementById('spinBtn');
    const pointer = document.getElementById('pointer');
    spinBtn.disabled = true;
    spinBtn.innerHTML = '...';
    pointer.classList.add('spinning');

    // 随机初速度：2~4 圈 + 随机偏移
    const extraRounds = 2 + Math.random() * 2;
    spinVelocity = extraRounds * 2 * Math.PI + Math.random() * 2 * Math.PI;

    // 随机减速系数（越小减速越快）
    const friction = 0.955 + Math.random() * 0.015;

    function animate() {
      spinVelocity *= friction;
      currentAngle = (currentAngle + spinVelocity) % (2 * Math.PI);

      drawWheel(currentAngle);

      if (spinVelocity > 0.001) {
        requestAnimationFrame(animate);
      } else {
        // 停止
        spinning = false;
        spinBtn.disabled = false;
        spinBtn.innerHTML = '开<br>转';
        pointer.classList.remove('spinning');
        showResult();
      }
    }

    requestAnimationFrame(animate);

    // 隐藏上次结果
    document.getElementById('resultOverlay').classList.remove('show');
  }

  // ========== 确定结果 ==========
  function showResult() {
    const n = foods.length;
    const sliceAngle = (2 * Math.PI) / n;

    // 指针在右边（0 弧度 = 3 点钟方向）
    // 标准化当前角度
    let normalized = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    // 指针角度：向上是 -π/2，即 3π/2 ≡ -π/2
    // 算出每个扇形区间
    for (let i = 0; i < n; i++) {
      const sliceStart = (i * sliceAngle) % (2 * Math.PI);
      const sliceEnd = ((i + 1) * sliceAngle) % (2 * Math.PI);

      // 指针指向右边 0 弧度 (3点钟)
      const pointerAngle = 0;

      // 判断指针是否在这个扇区内
      let start = sliceStart;
      let end = sliceEnd;
      if (end < start) end += 2 * Math.PI;

      let ptr = pointerAngle;
      if (ptr < start) ptr += 2 * Math.PI;
      if (ptr < start) ptr += 2 * Math.PI;

      // 简化：用相对于 normalized 的方式
      //
      // 转盘转了 currentAngle，所以扇形 i 的实际位置是：
      //   当前显示角度 = i * sliceAngle + currentAngle
      //
      // 指针在12点（屏幕坐标 -π/2 = 3π/2）
      // 我们需要找到当前指向12点的扇形
      //
      // 扇形0的起始边现在在 currentAngle
      // 指针（12点）在 3π/2
      // 指针相对于扇形0起始的角度：3π/2 - currentAngle
      // 属于第 floor((3π/2 - currentAngle) / sliceAngle) 个扇形
    }

    // 更直接的方法：
    // 扇形 i 的中心角度（屏幕坐标）= currentAngle + i * sliceAngle + sliceAngle/2
    // 归一化到 [0, 2π)
    // 指针在 0（右边），找距离指针最近的中心角
    let bestIdx = 0;
    let bestDist = Infinity;

    for (let i = 0; i < n; i++) {
      let centerAngle = (currentAngle + i * sliceAngle + sliceAngle / 2) % (2 * Math.PI);
      if (centerAngle < 0) centerAngle += 2 * Math.PI;

      let diff = Math.abs(centerAngle - 0);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;

      if (diff < bestDist) {
        bestDist = diff;
        bestIdx = i;
      }
    }

    const food = foods[bestIdx];
    document.getElementById('resultText').textContent = food;
    document.getElementById('resultOverlay').classList.add('show');
  }

  function closeResult() {
    document.getElementById('resultOverlay').classList.remove('show');
  }

  // ========== 食物管理 ==========
  // ========== Emoji 匹配表 ==========
  const EMOJI_MAP = [
    { keys: ['面', '拉面', '拌面', '凉面', '意面', '意大', 'pasta', '粉', '米线', '米粉', '河粉'], emoji: '🍜' },
    { keys: ['饺子', '水饺', '煎饺', '蒸饺', 'dumpling'], emoji: '🥟' },
    { keys: ['火锅', '涮', '麻辣烫', '冒菜', '串串', '关东煮'], emoji: '🥘' },
    { keys: ['饭', '盖浇', '煲仔', '炒饭', '便当', '丼', '咖喱', '卤肉', '猪脚'], emoji: '🍚' },
    { keys: ['汉堡', '炸鸡', '鸡块', '薯条', 'burger', '汉堡包'], emoji: '🍔' },
    { keys: ['披萨', 'pizza', '必胜客'], emoji: '🍕' },
    { keys: ['寿司', '刺身', '生鱼', 'sushi', '日料', '定食', '鳗鱼'], emoji: '🍱' },
    { keys: ['三明治', 'sandwich', '吐司'], emoji: '🥪' },
    { keys: ['塔可', 'taco', '卷饼', '墨西哥'], emoji: '🌮' },
    { keys: ['烤肉', '烧烤', 'bbq', '羊肉串', '烤串', '烧肉', '牛排', '五花肉', '猪排'], emoji: '🥩' },
    { keys: ['沙拉', '轻食', 'salad', '减脂'], emoji: '🥗' },
    { keys: ['麻辣香锅', '干锅', '香锅'], emoji: '🔥' },
    { keys: ['螺蛳粉', '酸辣粉', '螺狮粉'], emoji: '🍝' },
    { keys: ['汤', '汤面', '馄饨', '抄手', '云吞', '粥'], emoji: '🍲' },
    { keys: ['面包', '蛋糕', '甜点', '烘焙', '可颂', '牛角包'], emoji: '🥐' },
    { keys: ['炸', '油条', '煎饼', '鸡蛋灌饼'], emoji: '🥮' },
    { keys: ['鸡', '黃焖鸡', '黄焖鸡', '大盘鸡', '鸡公煲', '椰子鸡', '白切鸡'], emoji: '🍗' },
    { keys: ['冒菜', '毛血旺', '水煮'], emoji: '🌶️' },
    { keys: ['糖水', '甜品', '冰', '奶茶', '果茶', '柠檬茶', '咖啡', '冷饮'], emoji: '🍧' },
    { keys: ['水果', '苹果', '香蕉', '葡萄', '西瓜', '草莓', '芒果'], emoji: '🍎' },
    { keys: ['食堂', '快餐', '盒饭', '外卖', '随便', '将就'], emoji: '🍽️' },
  ];

  function matchEmoji(name) {
    // 如果已经有 emoji 开头，直接返回
    if (/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F900}-\u{1F9FF}\u{200D}]/u.test(name)) {
      return name;
    }
    const lower = name.toLowerCase();
    for (const item of EMOJI_MAP) {
      if (item.keys.some(k => lower.includes(k))) {
        return item.emoji + ' ' + name;
      }
    }
    // 没匹配到，给个通用食物图标
    return '🍽️ ' + name;
  }

  function addFood() {
    const input = document.getElementById('foodInput');
    const val = input.value.trim();
    if (!val) return;
    const withEmoji = matchEmoji(val);
    if (foods.includes(withEmoji)) {
      input.value = '';
      input.placeholder = '已经有了，换一个吧～';
      setTimeout(() => input.placeholder = '输入你想吃的（如：寿司）', 2000);
      return;
    }
    foods.push(withEmoji);
    input.value = '';
    input.focus();
    drawWheel(currentAngle);
    renderTags();
  }

  function removeFood(index) {
    if (foods.length <= 3) {
      alert('至少保留3个选项哦～');
      return;
    }
    foods.splice(index, 1);
    drawWheel(currentAngle);
    renderTags();
  }

  function resetFoods() {
    foods = [...DEFAULT_FOODS];
    drawWheel(currentAngle);
    renderTags();
  }

  function shuffleFoods() {
    for (let i = foods.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [foods[i], foods[j]] = [foods[j], foods[i]];
    }
    drawWheel(currentAngle);
    renderTags();
  }

  // ========== 食物标签渲染 ==========
  function renderTags() {
    const container = document.getElementById('foodTags');
    container.innerHTML = foods.map((food, i) =>
      `<span class="food-tag">
        ${food}
        <span class="del" onclick="removeFood(${i})" title="移除">✕</span>
      </span>`
    ).join('');
  }

  // ========== 点击弹窗外部关闭 ==========
  document.getElementById('resultOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeResult();
  });

  // ========== 键盘快捷键 ==========
  document.addEventListener('keydown', function(e) {
    // 输入框中不触发快捷键
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space' && !spinning) {
      e.preventDefault();
      spin();
    }
    if (e.code === 'Escape') {
      closeResult();
    }
  });

  // ========== 背景粒子 ==========
  (function createParticles() {
    const container = document.getElementById('particles');
    const emojis = ['🍜', '🍕', '🍔', '🍣', '🥟', '🍛', '🍝', '🌮', '🥘', '🍱'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.fontSize = (14 + Math.random() * 24) + 'px';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = Math.random() * 10 + 's';
      container.appendChild(el);
    }
  })();

  // ========== 点击转盘也可以旋转 ==========
  canvas.addEventListener('click', function(e) {
    if (spinning) return;
    // 排除点击中心按钮区域
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left - size/2;
    const cy = e.clientY - rect.top - size/2;
    if (Math.sqrt(cx*cx + cy*cy) < 52) return; // 中心按钮区域
    spin();
  });

  // ========== 摇一摇开转（手机） ==========
  let lastShakeTime = 0;
  if (typeof DeviceMotionEvent !== 'undefined') {
    let shakeEnabled = false;
    // iOS 13+ 需要用户手势触发权限请求
    document.addEventListener('click', function enableShake() {
      if (shakeEnabled) return;
      shakeEnabled = true;
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(r => { if (r !== 'granted') shakeEnabled = false; })
          .catch(() => { shakeEnabled = false; });
      }
    }, { once: false });

    window.addEventListener('devicemotion', function(e) {
      if (spinning || !shakeEnabled) return;
      const acc = e.accelerationIncludingGravity;
      if (!acc) return;
      const force = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
      const now = Date.now();
      // 晃动强度 > 25 且间隔 > 2 秒
      if (force > 25 && now - lastShakeTime > 2000) {
        lastShakeTime = now;
        spin();
      }
    });
  }

  // ========== 初始绘制 ==========
  drawWheel(currentAngle);
  renderTags();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  // 显示安装提示（Android Chrome / iOS 引导）
  let installPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    installPrompt = e;
  });

  // iOS 智能提示：Safari 中添加引导浮层
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !isStandalone && !localStorage.getItem('ios-hint-dismissed')) {
    setTimeout(function() {
      const hint = document.createElement('div');
      hint.style.cssText = `
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 999; background: #16213e; color: #eee; padding: 14px 22px;
        border-radius: 12px; font-size: 0.85rem; text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        display: flex; align-items: center; gap: 12px; max-width: 320px;
      `;
      hint.innerHTML = `
        <span>📱 点击分享 → <b>添加到主屏幕</b></span>
        <span style="cursor:pointer;font-size:1.2rem;opacity:0.5;" id="iosHintClose">✕</span>
      `;
      document.body.appendChild(hint);
      document.getElementById('iosHintClose').onclick = function() {
        hint.remove();
        localStorage.setItem('ios-hint-dismissed', '1');
      };
    }, 2000);
  }
</script>
